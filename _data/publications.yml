thesis:
  - year: 2024
    title: "Minimal Lagrangian orbits of Hamiltonian actions over KE and KRS"
    authors: "Federico Astolfi · Supervisor: Prof.ssa Anna Gori"
    venue: "MSc in Mathematics — Università degli Studi di Milano"
    abstract: "Hamiltonian actions of a Lie group on a symplectic manifold admit a moment map from the manifold to the dual of the Lie algebra. We study its application to Lagrangian orbits, giving an explicit formula for the moment map on Kähler Ricci Soliton manifolds and studying minimality of Lagrangian orbits when the acting Lie group is semisimple."
    links:
      - { label: "PDF", url: "/assets/MSc_Thesis_Astolfi.pdf" }
