talks:
  - date: "Jun 2026"
    title: "Decoding the Surface Code with Graph Neural Networks"
    conf: "57th Annual Meeting of APS DAMOP — Providence, Rhode Island"
    meta: "Contributed Talk · Session P04: Quantum Error Correction · Thu June 4, 10:30 a.m."
    authors: "Federico Astolfi, Hugo Perrin, Guido Pupillo"
    abstract: "Decoding plays a fundamental role in quantum error correction. In this talk, I present a decoding strategy based on Graph Neural Networks that exploits the graph structure of the detector error model generated for the Surface Code to perform error correction. I discuss its performance compared to traditional decoders and highlight current limitations and open challenges."
