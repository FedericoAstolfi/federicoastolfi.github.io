backend:
  name: github
  repo: FedericoAstolfi/federicoastolfi.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Federico Astolfi" }
      - { label: "Categories", name: "categories", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "home"
        label: "Home"
        file: "index.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Home" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "data"
    label: "Publications (data)"
    files:
      - name: "publications"
        label: "Publications, thesis & talks"
        file: "_data/publications.yml"
        fields:
          - label: "Papers"
            name: "papers"
            widget: "list"
            required: false
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Abstract", name: "abstract", widget: "text", required: false }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Thesis"
            name: "thesis"
            widget: "list"
            required: false
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Abstract", name: "abstract", widget: "text", required: false }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Talks"
            name: "talks"
            widget: "list"
            required: false
            fields:
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Conference", name: "conf", widget: "string" }
              - { label: "Meta", name: "meta", widget: "string", required: false }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Abstract", name: "abstract", widget: "text", required: false }
